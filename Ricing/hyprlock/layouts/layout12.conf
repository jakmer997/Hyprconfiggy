# Paths
$mpris_art = /tmp/hyde-mpris.png
$wall = $HOME/.config/hyprlock/wallpapers/6.jpg

# ------------------------
# Background
# ------------------------
background {
    monitor =
    path = $wall
    blur_passes = 1        # subtle blur
    contrast = 1.0
    brightness = 1       # darken for readability
    vibrancy = 0.1
}

# ------------------------
# General
# ------------------------
general {
    no_fade_in = false
    disable_loading_bar = true
    grace = 1
}

# ------------------------
# Greeting
# ------------------------
label {
    monitor =
    text = The factory must grow
    color = rgb(255, 255, 255)   # white for readability
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    position = -630, 320
    halign = center
    valign = center
}

# ------------------------
# Time
# ------------------------
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M %p")</span>"
    color = rgb(255, 255, 255)
    font_size = 40
    font_family = JetBrainsMono Nerd Font
    position = -630, 240
    halign = center
    valign = center
}

# ------------------------
# Day-Month-Date
# ------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.7) # semi-transparent white
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 180, 175
    halign = left
    valign = center
}

# ------------------------
# Profile photo
# ------------------------
image {
    monitor =
    path = ~/.config/hypr/pfp.webp
    border_size = 2
    border_color = rgba(255, 255, 255, 0.7)
    size = 160
    rounding = 80             # circular
    rotate = 0
    position = -630, 25
    halign = center
    valign = center
}

# ------------------------
# Input field
# ------------------------
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.1)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i> Do you know the way in?</i>
    hide_input = false
    position = -630, -220
    halign = center
    valign = center
}

# ------------------------
# User box
# ------------------------
shape {
    monitor =
    size = 320, 55
    color = rgba(0, 0, 0, 0.5) # dark translucent
    rounding = 15
    border_size = 0
    position = -630, -140
    halign = center
    valign = center
}

label {
    monitor =
    text = iam the great $USER
    color = rgb(255, 255, 255)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -630, -140
    halign = center
    valign = center
}

# ------------------------
# Music widget (optional)
# ------------------------
shape {
    monitor =
    size = 350, 110
    color = rgba(0, 0, 0, 0.5)
    rounding = 20
    position = -630, -350
    halign = center
    valign = center
}

image {
    monitor =
    path = $mpris_art
    size = 86
    border_size = 2
    border_color = rgba(255, 255, 255, 0.7)
    rounding = 10
    position = 167, -350
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$($music --artist)"
    color = rgb(255, 255, 255)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 270, -375
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$($music --title)"
    color = rgb(255, 255, 255)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 270, -350
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$($music --source)"
    color = rgba(255, 255, 255, 0.7)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 270, -320
    halign = left
    valign = center
}
